<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Definitions for gradients -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#764ba2" />
      <stop offset="50%" stop-color="#667eea" />
      <stop offset="100%" stop-color="#a18cd1" />
    </linearGradient>
    <linearGradient id="shape-gradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
    </linearGradient>
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="100" height="100" rx="24" fill="url(#bg-gradient)" />

  <!-- Abstract 'S' / Infinity Social Shape -->
  <g transform="translate(50, 50)" filter="url(#drop-shadow)">
    <path d="M 0,-18 
             C 12,-18 20,-10 20,0 
             C 20,10 12,18 0,18
             C -12,18 -20,10 -20,0
             C -20,-10 -12,-18 0,-18 Z" 
          fill="none" 
          stroke="url(#shape-gradient)" 
          stroke-width="12" 
          stroke-linecap="round"
          stroke-linejoin="round" />
    
    <!-- Overlapping Connection Dot -->
    <circle cx="20" cy="-16" r="6" fill="#ffffff" />
    <circle cx="-20" cy="16" r="6" fill="#ffffff" />
  </g>
</svg>
